name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, arena/01a0a966-globallocksummary]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog data
        run: npm run check

      - name: Build site
        run: node build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Mirror built site to Gitee Pages
        if: github.event_name == 'push'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: lin2mm
          GITEE_REPO: GlobalLockSummary
        run: |
          [ -z "$GITEE_TOKEN" ] && { echo skip; exit 0; }
          cd _site; touch .nojekyll; git init -q; git checkout -q -b gitee-pages; git add -A
          git -c user.name=gitee-mirror -c user.email=mirror@local commit -q -m "Mirror site"
          git remote add origin "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"
          git push -qf origin gitee-pages

      - name: Test identification logic against the built catalog
        run: node tests/scoring.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
